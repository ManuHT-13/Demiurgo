# Configuration for Experiment 1: Supervised CNN trained with the correct labels
#
# Defining hyperparameters here instead of hardcoding them into the source code 
# It allows you to run multiple experiments without modifying train_supervised.py, while also keeping a clear record of
# the exact configuration used to obtain each result

experiment_name: "resnet18_supervised_correct"

data:
  images_path: "data/raw/train_images.npy"
  labels_path: "data/raw/labels.csv"
  val_split: 0.1        # Reserve 10% of the training images for validation
  batch_size: 128       # Increase or decrease depending on your available VRAM (6 GB -> 128 should work well)
  num_workers: 2        # Number of parallel processes for data loading; 2–4 usually works well on a Ryzen 5 3600

model:
  num_classes: 10
  pretrained: false     # Train from scratch. See the explanation in src/models/resnet.py

training:
  epochs: 50            # Start with 50 epochs to inspect the learning curve; increase if performance is still improving
  learning_rate: 0.1    # Typical learning rate for SGD with ResNet on CIFAR-10
  momentum: 0.9
  weight_decay: 0.0005  # Regularization term that helps prevent overfitting
  mixed_precision: true # Use float16 where possible to reduce VRAM usage and speed up training
  seed: 42

output:
  checkpoints_dir: "experiments/resnet18_supervised_correct/checkpoints"
  logs_dir: "experiments/resnet18_supervised_correct/logs"